<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="h-full">
<head th:replace="~{layout :: head(${categoryId != null ? 'Edit category' : 'New category'})}"></head>
<body class="h-full">
<header th:replace="~{layout :: header}"></header>
<main class="mx-auto max-w-2xl px-4 py-8 sm:px-6">
    <div th:replace="~{layout :: alerts}"></div>

    <h1 class="mb-6 text-2xl font-bold text-slate-900"
        th:text="${categoryId != null ? 'Edit category' : 'New category'}">Category</h1>

    <form th:action="${categoryId != null ? '/categories/' + categoryId : '/categories'}" method="post"
          th:object="${form}" class="space-y-6">

        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-4">
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Slug</label>
                <input type="text" th:field="*{slug}" th:readonly="${readOnlySlug}" required pattern="[a-z0-9_]+"
                       title="Lowercase letters, digits, underscores"
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono shadow-sm focus:border-brand-500 focus:ring-brand-500 disabled:bg-slate-50 disabled:text-slate-500"/>
                <p class="mt-1 text-xs text-slate-500">Lowercase letters, digits, and underscores only</p>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Name</label>
                <input type="text" th:field="*{name}" required maxlength="100"
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"/>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Group</label>
                <div data-custom-select class="relative">
                    <input type="hidden" th:field="*{categoryGroup}" id="categoryGroup"/>
                    <button type="button" data-custom-select-trigger aria-expanded="false"
                            class="flex w-full items-center justify-between rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm transition hover:border-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                        <span data-custom-select-label data-placeholder="Select group" class="truncate">Select group</span>
                        <svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    <ul data-custom-select-menu
                        class="absolute z-30 mt-1 hidden w-full max-h-60 overflow-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg ring-1 ring-black/5">
                        <li th:each="g : ${categoryGroups}"
                            data-custom-select-option
                            th:attr="data-value=${g}, data-label=${#strings.capitalize(#strings.replace(g, '_', ' '))}"
                            class="cursor-pointer px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
                            th:text="${#strings.capitalize(#strings.replace(g, '_', ' '))}">group</li>
                    </ul>
                </div>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Description</label>
                <textarea th:field="*{description}" rows="3"
                          class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"></textarea>
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit"
                    class="rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-700">
                Save category
            </button>
            <a th:href="@{/categories}" class="rounded-lg px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
