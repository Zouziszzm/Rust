<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="h-full">
<head th:replace="~{layout :: head(${expenseId != null ? 'Edit expense' : 'New expense'})}"></head>
<body class="h-full">
<header th:replace="~{layout :: header}"></header>
<main class="mx-auto max-w-2xl px-4 py-8 sm:px-6">
    <div th:replace="~{layout :: alerts}"></div>

    <h1 class="mb-6 text-2xl font-bold text-slate-900"
        th:text="${expenseId != null ? 'Edit expense' : 'New expense'}">Expense</h1>

    <form th:action="${expenseId != null ? '/expenses/' + expenseId : '/expenses'}" method="post"
          th:object="${form}" id="expense-form" class="space-y-6">

        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-4">
            <h2 class="text-sm font-semibold text-slate-900">Basics</h2>
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Title</label>
                <input type="text" th:field="*{title}" required maxlength="200"
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"/>
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Category</label>
                <div data-custom-select class="relative" id="category-select-wrap">
                    <input type="hidden" th:field="*{categoryId}" id="category-select"/>
                    <button type="button" data-custom-select-trigger aria-expanded="false"
                            class="flex w-full items-center justify-between rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm transition hover:border-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                        <span data-custom-select-label data-placeholder="Select category" class="truncate">Select category</span>
                        <svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    <ul data-custom-select-menu
                        class="absolute z-30 mt-1 hidden w-full max-h-60 overflow-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg ring-1 ring-black/5">
                        <li data-custom-select-option data-value="" data-label="Select category"
                            class="cursor-pointer px-3 py-2 text-sm text-slate-500 hover:bg-slate-100">Select category</li>
                        <li th:each="c : ${categories}"
                            data-custom-select-option
                            th:attr="data-value=${c.id()}, data-group=${c.categoryGroup()}, data-label=${(c.categoryGroup() != null ? #strings.capitalize(#strings.replace(c.categoryGroup(), '_', ' ')) + ' — ' : '') + c.name()}"
                            class="cursor-pointer px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
                            th:text="${(c.categoryGroup() != null ? c.categoryGroup() + ' — ' : '') + c.name()}">category</li>
                    </ul>
                </div>
            </div>
            <div id="shop-field" class="hidden">
                <label class="mb-1 block text-sm font-medium text-slate-700">Shop</label>
                <div data-custom-select class="relative">
                    <input type="hidden" th:field="*{shopId}" id="shop-select"/>
                    <button type="button" data-custom-select-trigger aria-expanded="false"
                            class="flex w-full items-center justify-between rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm transition hover:border-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                        <span data-custom-select-label data-placeholder="Select shop" class="truncate">Select shop</span>
                        <svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    <ul data-custom-select-menu
                        class="absolute z-30 mt-1 hidden w-full max-h-60 overflow-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg ring-1 ring-black/5">
                        <li data-custom-select-option data-value="" data-label="Select shop"
                            class="cursor-pointer px-3 py-2 text-sm text-slate-500 hover:bg-slate-100">Select shop</li>
                        <li th:each="s : ${shops}"
                            data-custom-select-option
                            th:attr="data-value=${s.id()}, data-label=${s.name()}"
                            class="cursor-pointer px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
                            th:text="${s.name()}">shop</li>
                    </ul>
                </div>
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Date</label>
                    <input type="date" th:field="*{occurredAtInput}" required
                           class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"/>
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Payment method</label>
                    <div data-custom-select class="relative">
                        <input type="hidden" th:field="*{paymentMethod}" id="payment-method-select"/>
                        <button type="button" data-custom-select-trigger aria-expanded="false"
                                class="flex w-full items-center justify-between rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm transition hover:border-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                            <span data-custom-select-label data-placeholder="Select payment" class="truncate">Select payment</span>
                            <svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <ul data-custom-select-menu
                            class="absolute z-30 mt-1 hidden w-full max-h-60 overflow-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg ring-1 ring-black/5">
                            <li th:each="pm : ${paymentMethods}"
                                data-custom-select-option
                                th:attr="data-value=${pm}, data-label=${#strings.capitalize(#strings.replace(pm, '_', ' '))}"
                                class="cursor-pointer px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
                                th:text="${#strings.capitalize(#strings.replace(pm, '_', ' '))}">payment</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap gap-6">
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="checkbox" th:field="*{recurring}" class="rounded border-slate-300 text-brand-600"/>
                    Recurring (monthly)
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="checkbox" th:field="*{refundable}" class="rounded border-slate-300 text-brand-600"/>
                    Refundable
                </label>
            </div>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="mb-3 text-sm font-semibold text-slate-900">Amount paid</h2>
            <label class="mb-1 block text-sm font-medium text-slate-700">Total (yen)</label>
            <input type="number" th:field="*{amountTotal}" min="1" required
                   class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"/>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <button type="button" id="tax-toggle"
                    class="text-sm font-semibold text-brand-600 hover:text-brand-700">
                Receipt tax details (optional)
            </button>
            <div id="tax-details" class="mt-4 hidden space-y-3">
                <div class="grid gap-3 sm:grid-cols-2">
                    <div><label class="text-xs text-slate-500">Subtotal 10%</label>
                        <input type="number" th:field="*{subtotal10Percent}" min="0" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
                    <div><label class="text-xs text-slate-500">Tax 10%</label>
                        <input type="number" th:field="*{taxAmount10Percent}" min="0" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
                    <div><label class="text-xs text-slate-500">Subtotal 8% (food)</label>
                        <input type="number" th:field="*{subtotal8Percent}" min="0" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
                    <div><label class="text-xs text-slate-500">Tax 8%</label>
                        <input type="number" th:field="*{taxAmount8Percent}" min="0" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
                    <div><label class="text-xs text-slate-500">Tax exempt</label>
                        <input type="number" th:field="*{taxExemptAmount}" min="0" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
                    <div><label class="text-xs text-slate-500">Tax total</label>
                        <input type="number" th:field="*{taxAmountTotal}" min="0" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
                </div>
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" th:field="*{qualifiedInvoice}" class="rounded border-slate-300"/>
                    Qualified invoice
                </label>
                <input type="text" th:field="*{invoiceRegistrationNumber}" placeholder="T1234567890123" maxlength="14"
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/>
                <input type="text" th:field="*{receiptNumber}" placeholder="Receipt number" maxlength="100"
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/>
                <input type="text" th:field="*{merchantName}" placeholder="Merchant name" maxlength="200"
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/>
            </div>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <label class="mb-1 block text-sm font-medium text-slate-700">Notes</label>
            <textarea th:field="*{notes}" rows="3"
                      class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"></textarea>
        </div>

        <div class="flex gap-3">
            <button type="submit"
                    class="rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-700">
                Save expense
            </button>
            <a th:href="@{/expenses}" class="rounded-lg px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script th:inline="javascript">
    const shopGroups = /*[[${shopRequiredGroups}]]*/ ['groceries', 'personal_care'];
    const categoryHidden = document.getElementById('category-select');
    const shopField = document.getElementById('shop-field');

    document.getElementById('tax-toggle').addEventListener('click', () =>
        document.getElementById('tax-details').classList.toggle('hidden'));

    function updateShopVisibility() {
        const wrap = document.getElementById('category-select-wrap');
        const value = categoryHidden.value;
        const opt = wrap.querySelector('[data-custom-select-option][data-value="' + value + '"]');
        const group = opt ? opt.dataset.group || '' : '';
        shopField.classList.toggle('hidden', !shopGroups.includes(group));
    }

    categoryHidden.addEventListener('change', updateShopVisibility);
    document.addEventListener('DOMContentLoaded', updateShopVisibility);
</script>
</body>
</html>
