[package]
name = "lumen-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust engine for Lumen — Anki import, SQLite persistence, FSRS scheduling, and card templates"
readme = "README.md"

[lib]
name = "lumen_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rs-fsrs = "1.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = "2"
zstd = "0.13"
