services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odot
      POSTGRES_PASSWORD: odot
      POSTGRES_DB: odot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odot -d odot"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://odot:odot@postgres:5432/odot
      HOST: 0.0.0.0
      PORT: 8080
      DB_POOL_MAX: 5
      CORS_ORIGIN: http://localhost:3000
      RUST_LOG: info,odot=debug
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
